<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ibne Galib - Developer Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b0f19'/><text x='15' y='70' font-family='monospace' font-size='60' font-weight='bold' fill='%2338bdf8'>&gt;_</text></svg>">
  <style>
    /* CSS Variables */
    :root {
      --bg-color: #0a0e17;
      --panel-bg: #111827;
      --border-color: #1e293b;
      --accent-cyan: #38bdf8;
      --accent-green: #4ade80;
      --accent-yellow: #fbbf24;
      --accent-red: #f87171;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --font-mono: 'Fira Code', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: var(--font-mono);
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: rgba(10, 14, 23, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.9rem;
    }

    .nav-status {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .status-dot {
      color: var(--accent-green);
      animation: blink 2s infinite;
    }

    .uptime-badge {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      color: var(--accent-cyan);
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
        text-shadow: 0 0 8px var(--accent-green);
      }

      50% {
        opacity: 0.4;
        text-shadow: none;
      }
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--accent-cyan);
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    /* Terminal Window Styles */
    .terminal-window {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .terminal-header {
      background-color: #0f172a;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      gap: 0.5rem;
    }

    .window-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .dot-red {
      background-color: var(--accent-red);
    }

    .dot-yellow {
      background-color: var(--accent-yellow);
    }

    .dot-green {
      background-color: var(--accent-green);
    }

    .terminal-title {
      font-family: var(--font-mono);
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-left: 0.5rem;
      flex-grow: 1;
      text-align: center;
    }

    .terminal-body {
      padding: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .prompt-line {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .prompt {
      color: var(--accent-green);
    }

    .command {
      color: var(--accent-cyan);
    }

    .output {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      white-space: pre-wrap;
    }

    /* Hero Section */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
      margin-bottom: 6rem;
      padding-top: 2rem;
    }

    .hero-profile {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }


    .hero-name {
      font-size: 3rem;
      font-weight: 600;
      line-height: 1.2;
      background: linear-gradient(90deg, var(--text-main), var(--accent-cyan));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-title {
      font-size: 1.25rem;
      color: var(--accent-green);
      font-family: var(--font-mono);
    }

    .hero-bio {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 90%;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .btn-primary {
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    .btn-primary:hover {
      background-color: var(--accent-cyan);
      color: var(--bg-color);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-outline:hover {
      border-color: var(--text-main);
      background-color: rgba(226, 232, 240, 0.05);
    }

    /* Section Headers */
    .section-title {
      font-size: 2rem;
      margin-bottom: 3rem;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .section-title::before {
      content: '~/';
      color: var(--accent-green);
    }

    .section-title::after {
      content: '';
      flex-grow: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border-color), transparent);
    }

    /* Skills */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 6rem;
    }

    .skill-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      transition: transform 0.2s, border-color 0.2s;
    }

    .skill-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-cyan);
    }

    .skill-category {
      font-family: var(--font-mono);
      color: var(--accent-cyan);
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .skill-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .skill-list li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .skill-list li::before {
      content: '>';
      color: var(--accent-green);
      font-family: var(--font-mono);
    }

    /* Projects */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 2rem;
      margin-bottom: 6rem;
    }

    .project-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .project-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 1rem;
    }

    .project-header-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .project-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .project-status {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .status-online {
      background-color: rgba(74, 222, 128, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(74, 222, 128, 0.2);
    }

    .status-production {
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .project-desc {
      color: var(--text-muted);
      flex-grow: 1;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: auto;
    }

    .tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background-color: rgba(226, 232, 240, 0.05);
      border: 1px solid var(--border-color);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .project-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      border-top: 1px dashed var(--border-color);
      padding-top: 1rem;
    }

    .btn-terminal {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      transition: all 0.2s;
    }

    .btn-terminal::before {
      content: '$';
      color: var(--accent-green);
    }

    .btn-terminal:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Education Timeline */
    .timeline {
      position: relative;
      padding-left: 2rem;
      margin-bottom: 6rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: var(--border-color);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 2.5rem;
    }

    .timeline-item:last-child {
      margin-bottom: 0;
    }

    .timeline-dot {
      position: absolute;
      left: -2.35rem;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: var(--bg-color);
      border: 2px solid var(--accent-cyan);
    }

    .timeline-content {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      border-radius: 8px;
    }

    .timeline-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }

    .timeline-subtitle {
      font-family: var(--font-mono);
      color: var(--accent-yellow);
      font-size: 0.9rem;
    }

    /* Contact / Footer */
    .contact-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 3rem;
      text-align: center;
      margin-bottom: 4rem;
    }

    .contact-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .contact-title::before {
      content: '>';
      color: var(--accent-green);
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    footer {
      text-align: center;
      font-family: var(--font-mono);
      color: var(--text-muted);
      font-size: 0.85rem;
      padding-bottom: 2rem;
      border-top: 1px solid var(--border-color);
      padding-top: 2rem;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .nav-links {
        display: none;
      }
    }
  </style>
</head>

  <!-- App Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Navbar & Uptime
      document.getElementById('nav-host').innerText = `host: ${PORTFOLIO_DATA.profile.host} (${PORTFOLIO_DATA.profile.status})`;

      const navContainer = document.getElementById('nav-links-container');
      PORTFOLIO_DATA.nav.forEach(link => {
        const a = document.createElement('a');
        a.href = link.href;
        a.innerText = link.label;
        navContainer.appendChild(a);
      });

      let seconds = 0;
      setInterval(() => {
        seconds++;
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        document.getElementById('uptime').innerText = `up ${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }, 1000);

      // 2. Hero Section
      document.getElementById('hero-name').innerText = PORTFOLIO_DATA.profile.name;
      document.getElementById('hero-title').innerText = PORTFOLIO_DATA.profile.title;
      document.getElementById('hero-bio').innerText = PORTFOLIO_DATA.profile.bio;
      document.getElementById('footer-name').innerText = PORTFOLIO_DATA.profile.name;
      document.getElementById('current-year').innerText = new Date().getFullYear();

      // Terminal Preview
      const termBody = document.getElementById('hero-terminal-body');
      PORTFOLIO_DATA.terminalCommands.forEach(cmd => {
        const promptBlock = document.createElement('div');
        promptBlock.className = 'prompt-line';
        promptBlock.innerHTML = `<span class="prompt">➜</span> <span class="command">${cmd.cmd}</span>`;

        const outputBlock = document.createElement('div');
        outputBlock.className = 'output';
        outputBlock.innerText = cmd.output;

        termBody.appendChild(promptBlock);
        termBody.appendChild(outputBlock);
      });
      // Add blinking cursor
      const cursorLine = document.createElement('div');
      cursorLine.className = 'prompt-line';
      cursorLine.innerHTML = `<span class="prompt">➜</span> <span class="status-dot">█</span>`;
      termBody.appendChild(cursorLine);

      // 3. Skills Matrix
      const skillsContainer = document.getElementById('skills-container');
      PORTFOLIO_DATA.skills.forEach(skillGroup => {
        const card = document.createElement('div');
        card.className = 'skill-card';

        const catTitle = document.createElement('h3');
        catTitle.className = 'skill-category';
        catTitle.innerText = `./${skillGroup.category.toLowerCase().replace(/[\s&]+/g, '-')}`;

        const ul = document.createElement('ul');
        ul.className = 'skill-list';
        skillGroup.items.forEach(item => {
          const li = document.createElement('li');
          li.innerText = item;
          ul.appendChild(li);
        });

        card.appendChild(catTitle);
        card.appendChild(ul);
        skillsContainer.appendChild(card);
      });

      // 4. Projects
      const projectsContainer = document.getElementById('projects-container');
      PORTFOLIO_DATA.projects.forEach(project => {
        const wrapper = document.createElement('div');
        wrapper.className = 'terminal-window project-card';

        const header = document.createElement('div');
        header.className = 'terminal-header';
        header.innerHTML = `
          <div class="window-dot dot-red"></div>
          <div class="window-dot dot-yellow"></div>
          <div class="window-dot dot-green"></div>
          <div class="terminal-title"></div>
        `;

        const body = document.createElement('div');
        body.className = 'project-body';

        const statusClass = project.status === 'PRODUCTION' ? 'status-production' : 'status-online';

        const infoHtml = `
          <div class="project-header-info">
            <h3 class="project-name">${project.title}</h3>
            <span class="project-status ${statusClass}">
              <span class="status-dot" style="animation: none;">●</span> ${project.status}
            </span>
          </div>
          <p class="project-desc">${project.desc}</p>
          <div class="project-tags">
            ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
          <div class="project-actions">
            ${project.repo ? `<a href="${project.repo}" target="_blank" class="btn-terminal">GitHub Repo ↗</a>` : ''}
            ${project.live ? `<a href="${project.live}" target="_blank" class="btn-terminal">Live Demo ↗</a>` : ''}
          </div>
        `;

        body.innerHTML = infoHtml;
        wrapper.appendChild(header);
        wrapper.appendChild(body);
        projectsContainer.appendChild(wrapper);
      });

      // 5. Education
      const eduContainer = document.getElementById('education-container');
      PORTFOLIO_DATA.education.forEach(edu => {
        const item = document.createElement('div');
        item.className = 'timeline-item';
        item.innerHTML = `
          <div class="timeline-dot"></div>
          <div class="timeline-content">
            <h3 class="timeline-title">${edu.degree}</h3>
            <div class="timeline-subtitle">${edu.institution} | ${edu.year}</div>
          </div>
        `;
        eduContainer.appendChild(item);
      });

      // 6. Contact
      const contactContainer = document.getElementById('contact-container');
      const c = PORTFOLIO_DATA.contact;

      const createBtn = (label, href, cmd) => {
        return `<a href="${href}" target="_blank" class="btn-terminal" style="font-size: 1rem; padding: 0.75rem 1.5rem;">${cmd} ${label}</a>`;
      };

      let contactHtml = '';
      if (c.github) contactHtml += createBtn('GitHub', c.github, 'curl');
      if (c.linkedin) contactHtml += createBtn('LinkedIn', c.linkedin, 'ssh');
      if (c.email) contactHtml += createBtn('Email', `mailto:${c.email}`, 'mail');
      if (c.website) contactHtml += createBtn('Website', c.website, 'ping');

      contactContainer.innerHTML = contactHtml;
    });
  </script>
</body>

</html>
